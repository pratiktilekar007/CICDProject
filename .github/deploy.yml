name: Spring Boot CI CD Deploy

on:
  push:
    branches:
      - main
      -
env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout_Source
        uses: actions/checkout@v7

      - name: Setting_Up_Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build_Jar
        run: mvn clean package -DskipTests

      - name: Building_Docker_image
        run: docker build -t ${{secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Login_To_Docker
        uses: docker/login-action@v4
        with:
            username: ${{secrets.DOCKER_USERNAME }}
            password: ${{secrets.DOCKER_PASSWORD }}

      - name: Push_Image
        run : docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy_to_EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SHH_KEY }}
          script:
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker stop spring-bbot-app || true
            docker rm spring-bbot-app || true
            docker run -d --name spring-boot-app --restart unless-stopped -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f